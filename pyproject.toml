[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck"
version = "0.1.0"
description = "Judge a Spotify playlist: mood, age, personality and listening habits from metadata, audio features and lyrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
# Pretrained lyric-emotion model (j-hartmann/emotion-english-distilroberta-base).
# Without it, vibecheck falls back to an offline lexicon model.
nlp = ["transformers>=4.40", "torch>=2.2"]
notebook = ["jupyterlab>=4", "ipykernel"]
dev = ["pytest>=8"]

[project.scripts]
vibecheck = "vibecheck.cli:main"

[tool.setuptools.packages.find]
include = ["vibecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
